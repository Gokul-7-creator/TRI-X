services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: triagex
      POSTGRES_USER: triagex
      POSTGRES_PASSWORD: ${DB_PASSWORD:-triagex_local}
    ports:
      - '127.0.0.1:${DB_HOST_PORT:-55432}:5432'
    volumes:
      - triagex_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U triagex -d triagex']
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  triagex_postgres:
